<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Offline retail point of sale: sales, barcode scanning, inventory, cash change, accounts receivable and reports in Philippine Peso.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Store POS">
<meta name="format-detection" content="telephone=no">
<title>Store POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" id="logo">₱</div>
      <div class="brand-text">
        <strong id="storeName">Store POS</strong>
        <span id="storeSub">Retail point of sale</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill" id="registerPill">Register 1</span>
      <button class="icon-btn" id="btnHelp" type="button" aria-label="Help">?</button>
    </div>
  </header>

  <div class="body">
    <nav class="nav" id="nav" aria-label="Main">
      <button type="button" data-view="sales" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.6 11.2A2 2 0 0 0 9.55 17H18a2 2 0 0 0 1.95-1.55L21 9H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
        <span>Sales</span>
      </button>
      <button type="button" data-view="inventory">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>
        <span>Inventory</span>
      </button>
      <button type="button" data-view="receivables">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c.6-3.4 3.1-5.4 6.2-5.4S14.6 16.6 15.2 20"/><path d="M17 7.5h4M19 5.5v4"/></svg>
        <span>Receivables</span>
      </button>
      <button type="button" data-view="reports">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 20v-6M12 20V6M17 20v-9"/></svg>
        <span>Reports</span>
      </button>
      <button type="button" data-view="backup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
        <span>Backup</span>
      </button>
      <button type="button" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/zxing.min.js"></script>
<script src="js/core.js"></script>
<script src="js/pos.js"></script>
<script src="js/books.js"></script>
<script src="js/data.js"></script>
</body>
</html>
